{% load static %}
<section id="faq" class="section">
    <div class="container">
        <div class="section-header text-center" style="max-width: 680px; margin-left: auto; margin-right: auto; text-align: center;">
            <span class="section-badge">06. Engineering Q&A</span>
            <h2 class="section-title">Frequently Asked Questions</h2>
            <p class="section-desc" style="margin-left: auto; margin-right: auto;">
                Direct answers regarding my technical stack, architecture capabilities, and development approach.
            </p>
        </div>

        <div class="faq-container">
            {% for q in questions %}
            <div class="faq-item" id="faq-item-{{ q.id }}">
                <button class="faq-trigger" aria-expanded="false" aria-controls="faq-answer-{{ q.id }}">
                    <span>{{ q.quest }}</span>
                    <svg class="faq-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polyline points="6 9 12 15 18 9"></polyline>
                    </svg>
                </button>
                <div class="faq-body" id="faq-answer-{{ q.id }}">
                    <div class="faq-content">
                        {{ q.answer|linebreaksbr }}
                    </div>
                </div>
            </div>
            {% empty %}
                <p class="text-muted text-center">Frequently asked questions will appear here.</p>
            {% endfor %}
        </div>
    </div>
</section>
