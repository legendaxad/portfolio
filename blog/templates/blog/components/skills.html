{% load static %}

<div id="carouselExample" class="carousel slide" data-ride="carousel">
  <div class="carousel-inner text-center">
    {% for cert in certificates %}
        <div class="carousel-item {% if forloop.first %}active{% endif %}">

            <img src="{{ cert.image.url }}" class="certificate-img" alt="{{ cert.title }}">

            <div class="certificate-info mt-4">
                <h5>{{ cert.title }}</h5>
                <p class="text-muted">{{ cert.issuer }} • {{ cert.year }}</p>
                <p>{{ cert.description }}</p>

                {% if cert.verify_link %}
                    <a href="{{ cert.verify_link }}" target="_blank" class="btn btn-sm btn-primary">
                        Verify Certificate
                    </a>
                {% endif %}
            </div>

        </div>
    {% endfor %}
</div>

 <a class="carousel-control-prev custom-control" href="#carouselExample" role="button" data-slide="prev">
    <span class="carousel-control-prev-icon"></span>
</a>
 <a class="carousel-control-next custom-control" href="#carouselExample" role="button" data-slide="next">
    <span class="carousel-control-next-icon"></span>
</a>
</div>
